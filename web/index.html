<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend</title>
<style>
/* Blend · Classic skin (inspired by the Windows 98 CD Player): flat grey windows with 3D bevels, navy
   gradient title bars, underlined menus, grey waveform displays with faint grid lines, square transport buttons with the
   seek slider in the same row, sunken status bars. */
@font-face{font-family:VT323;src:url('fonts/vt323.woff2') format('woff2')}
@font-face{font-family:'Share Tech Mono';src:url('fonts/sharetech.woff2') format('woff2')}
:root{
  --face:#c0c0c0; --hi:#ffffff; --lite:#dfdfdf; --shadow:#808080; --dark:#000000;
  --title1:#000080; --title2:#1084d0; --title-off1:#808080; --title-off2:#b5b5b5;
  --disp:#808080; --disp-grid:#6e6e6e; --wave:#e4e4e4;
  --sel:#000080; --ink:#000; --muted:#404040; --red:#c00000;
  --ui:Tahoma,Geneva,Verdana,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#008080;color:var(--ink);font:12px/1.25 var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}

/* bevels: raised (buttons, windows) and sunken (displays, fields) */
.raised,.win,.pill,.seg button,.rbtn,.rnd{box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--lite)}
.sunken,.lcd,.pl,.plsearch,.screen,.status,.sb>span,.xf,.edwave-box{box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite)}

/* ---------- windows ---------- */
.win{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--face);padding:3px}
.tbar{flex:none;height:20px;display:flex;align-items:center;gap:4px;padding:0 3px 0 4px;background:linear-gradient(90deg,var(--title-off1),var(--title-off2));color:#d4d0c8}
.win.on>.tbar,.float>.tbar,#w-mix>.tbar{background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff}
.tbar b{font:bold 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tbar .ico{width:16px;height:16px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 2px,#7ec8ff 2.5px,#cfeaff 5px,#5aa9e6 7px,#2f6fb8 8px)}
.tbar .cap{display:flex;gap:2px;flex:none}
.tbar .x{width:16px;height:14px;background:var(--face);color:#000;font:bold 10px/1 var(--ui);display:grid;place-items:center;
  box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--lite)}
.tbar .x:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--hi)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px;padding:4px 3px 3px;position:relative}

/* ---------- menu bar ---------- */
.menubar{height:24px;display:flex;align-items:center;gap:0;padding:0 6px 0 76px;background:var(--face);border-bottom:1px solid var(--shadow);box-shadow:0 1px 0 var(--hi);position:relative;z-index:20}
.menubar .m{position:relative}
.menubar .m>button{height:20px;padding:0 8px;font-size:12px}
.menubar .m>button u{text-decoration:underline}
.menubar .m.open>button{background:var(--sel);color:#fff}
.menubar .dd{position:absolute;top:21px;left:0;min-width:220px;padding:2px;background:var(--face);display:none;
  box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--hi),2px 2px 0 rgba(0,0,0,.25)}
.menubar .m.open .dd{display:block}
.menubar .dd button{display:flex;justify-content:space-between;width:100%;padding:3px 20px 3px 18px;text-align:left}
.menubar .dd button:hover{background:var(--sel);color:#fff}
.menubar .dd kbd{font:12px var(--ui);color:inherit;opacity:.8}
.menubar .wm{margin-left:auto;font:bold 12px var(--ui);color:#000;display:flex;align-items:center;gap:6px}
.menubar .wm i{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0 2px,#7ec8ff 2.5px,#cfeaff 4.5px,#5aa9e6 6px,#2f6fb8 7px)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.layout{display:grid;gap:6px;padding:6px;min-height:0;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:minmax(120px,1fr) auto auto auto;
  grid-template-areas:"vis pl" "a pl" "b art" "mix art"}
#w-vis{grid-area:vis} .deck[data-d="0"]{grid-area:a} .deck[data-d="1"]{grid-area:b} #w-mix{grid-area:mix} #w-pl{grid-area:pl} #w-art{grid-area:art}

/* ---------- controls ---------- */
.pill,.seg button{height:23px;padding:0 10px;background:var(--face);display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;color:#000;font-size:12px}
.pill:active,.seg button:active,.pill.on,.seg button.on{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--shadow),inset -2px -2px 0 var(--lite);
  background:repeating-conic-gradient(var(--face) 0 25%,#dcdcdc 0 50%) 0 0/2px 2px;padding-top:1px}
.pill.go{font-weight:bold}
.pill:disabled,.seg button:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hi);cursor:default}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#7a0000;box-shadow:inset 1px 1px 0 rgba(0,0,0,.4)}
.pill.on .dot{background:#ff2a1a}
.pill svg{width:11px;height:11px}
.seg{display:inline-flex;gap:0}
.rbtn{width:30px;height:23px;flex:none;display:grid;place-items:center;background:var(--face);color:#000}
.rbtn.big{width:52px}
.rbtn:active,.rbtn.on{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--shadow),inset -2px -2px 0 var(--lite)}
.rbtn svg{width:11px;height:11px}
.rbtn[data-act="back"],.rbtn[data-act="fwd"]{font:bold 15px/1 var(--ui);width:26px}
.rnd{height:23px;padding:0 8px;display:inline-flex;align-items:center;background:var(--face);font:12px var(--ui);color:#000}
.rnd.on{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--shadow),inset -2px -2px 0 var(--lite)}
.rndlab{display:flex}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer;min-width:0;flex:1}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#fff;box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:21px;margin-top:-9px;background:var(--face);
  box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--lite)}
.lab{font-size:12px;color:#000;white-space:nowrap}
.lab u{text-decoration:underline}

/* ---------- displays ---------- */
.lcd{position:relative;background:#000;color:#7ff3ff;font-family:VT323,monospace;overflow:hidden}
.chipl{display:inline-flex;align-items:center;gap:5px;font:12px 'Share Tech Mono',monospace;color:#3fa9b5}
.chipl b{font-weight:normal;color:#7ff3ff;min-width:38px}
.chipl.hot b{color:#ffe36b}
.wavebox{background:var(--disp)!important;color:#000}

/* ---------- decks ---------- */
.deck .row1{display:flex;gap:6px;min-height:0;align-items:stretch}
.deck .lcd.main{flex:1;height:64px;display:grid;grid-template-columns:auto auto 1fr;grid-template-rows:1fr auto;column-gap:14px;padding:4px 10px 3px}
.deck .state{grid-row:1/3;align-self:center;display:flex;align-items:center;gap:8px}
.deck .state .glyph{font-size:16px;color:#3fa9b5;width:16px}
.deck .state .t{font-size:clamp(30px,3.3vw,46px);line-height:.8;letter-spacing:.04em;white-space:nowrap}
.deck .chips{grid-row:1;display:flex;gap:12px;align-items:center}
.deck .spec{grid-row:1/3;justify-self:end;align-self:center;width:clamp(70px,9vw,130px);height:40px}
.deck .scroll{grid-column:2;grid-row:2;font-size:18px;line-height:1.15;padding-bottom:2px;white-space:nowrap;overflow:hidden;letter-spacing:.04em;color:#7ff3ff;max-width:100%}
.deck .scroll span{display:inline-block}
.deck .side{display:flex;flex-direction:column;gap:3px;justify-content:center}
.deck .side .rnd{width:64px;height:19px;justify-content:center}
.deck .wavebox{height:84px;padding:2px}
.deck .wavebox canvas{width:100%;height:100%;display:block;cursor:grab}
.deck .row4{display:flex;align-items:center;gap:3px;min-width:0}
.deck .seek{flex:1;height:23px;position:relative;cursor:pointer;margin:0 3px}
.deck .seek canvas{position:absolute;inset:0;width:100%;height:100%}
.deck .row5{display:flex;align-items:center;gap:6px;min-width:0}
.deck .row5 .vol{display:flex;align-items:center;gap:4px;width:140px;flex:none}
.deck .row5 .stemrow{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.deck .row5 .stemrow .pill{height:21px;padding:0 7px;font-size:11.5px}
.deck .row5 .stemrow .pill.muted{color:var(--shadow);text-decoration:line-through}
.deck.drop{outline:2px dashed var(--sel);outline-offset:-4px}
.sb{display:flex;gap:2px;height:20px;flex:none}
.sb>span{display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.sb>span.grow{flex:1}
.sb .grip{width:14px;align-self:flex-end;height:14px;background:linear-gradient(135deg,transparent 0 45%,var(--hi) 45% 50%,var(--shadow) 50% 58%,transparent 58% 66%,var(--hi) 66% 71%,var(--shadow) 71% 79%,transparent 79%)}

/* ---------- blend window ---------- */
#w-mix .row{display:flex;align-items:center;gap:6px;min-width:0}
.xf{position:relative;flex:1;height:30px;cursor:ew-resize;touch-action:none;background:var(--face)}
.xf .tick{position:absolute;left:50%;top:4px;bottom:4px;width:1px;background:var(--shadow);box-shadow:1px 0 0 var(--hi)}
.xf::before{content:"";position:absolute;left:10px;right:10px;top:13px;height:4px;background:#fff;box-shadow:inset 1px 1px 0 var(--shadow),inset 2px 2px 0 var(--dark)}
.xf .knob{position:absolute;top:3px;width:14px;height:24px;margin-left:-7px;background:var(--face);
  box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--lite)}
.abl{font:bold 12px var(--ui);width:14px;text-align:center}
.tempo{height:23px;display:flex;align-items:center;gap:4px;padding:0 8px;background:#000;color:#3fa9b5;font:12px 'Share Tech Mono',monospace;white-space:nowrap;
  box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite)}
.tempo b{font:20px VT323,monospace;color:#7ff3ff;font-weight:normal}
.status{flex:1;min-width:0;height:23px;display:flex;align-items:center;gap:10px;padding:0 6px;font:12px var(--ui);white-space:nowrap;overflow:hidden;background:var(--face)}
.status .r{color:var(--muted)}
.status .ex{color:#006400;font-weight:bold} .status .gd{color:#7a5a00;font-weight:bold} .status .na{color:var(--red);font-weight:bold}

/* ---------- playlist (list view) ---------- */
.plsearch{height:22px;border:0;background:#fff;padding:0 6px;font:12px var(--ui);outline:none}
.pl{flex:1;min-height:0;overflow:auto;background:#fff;padding:2px}
.pl::-webkit-scrollbar{width:16px;background:repeating-conic-gradient(var(--face) 0 25%,#fff 0 50%) 0 0/2px 2px}
.pl::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--lite)}
.plhead{display:grid;grid-template-columns:minmax(0,1fr) 88px 46px;flex:none}
.plhead span{height:20px;display:flex;align-items:center;padding:0 6px;background:var(--face);font-size:12px;
  box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--shadow)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 88px 46px;align-items:center;padding:1px 4px;color:#000;font-size:12px;cursor:default;white-space:nowrap}
.prow .n{overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.prow .m{font:12px var(--ui);color:var(--muted)}
.prow .d{text-align:right;padding-right:2px}
.prow.sel{background:var(--sel);color:#fff}
.prow.sel .m{color:#fff}
.prow.dim{color:var(--shadow)}
.prow .q{font-size:10px;background:#ffffe1;color:#000;border:1px solid #000;padding:0 3px;margin-right:5px}
.prow .on{font-size:10px;background:#000080;color:#fff;padding:0 4px;margin-right:5px}
.prow.sel .on{background:#fff;color:#000080}
.plbar{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.plbar .lcdtime{height:22px;padding:0 8px;display:flex;align-items:center;font:12px var(--ui);background:var(--face);color:#000;box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi)}
.empty{padding:24px 12px;color:var(--muted);text-align:center}

/* ---------- album art ---------- */
#w-art .body{align-items:stretch;justify-content:flex-start}
#w-art .vjbox{flex:1;min-height:0;background:#000;position:relative;box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite);padding:2px}
#w-art .vjstack,.vjstack{position:relative;width:100%;height:100%;overflow:hidden}
.vjstack>*{position:absolute;inset:0;width:100%;height:100%;display:block}
.vjbase{filter:grayscale(.88) contrast(1.18) brightness(1.02)}   /* black-and-white base, a little colour left */
.vjred{background:#d0201a;mix-blend-mode:color;opacity:0;pointer-events:none}   /* red: the one colour moment */
#w-art .vjnote{position:absolute;inset:0;display:grid;place-items:center;color:#c0c0c0;font:12px var(--ui);text-align:center;padding:20px}
#w-art .vtool{display:flex;gap:3px;align-items:center}
#w-art select{height:22px;border:0;background:#fff;padding:0 4px;font:12px var(--ui);max-width:150px}
#w-art .cover{align-self:center;flex:1}
#w-art .cover{height:calc(100% - 6px);aspect-ratio:1;max-width:calc(100% - 6px);background:#000 center/cover no-repeat;
  box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite);border:3px solid var(--face);outline:0}
#w-art .cover.none{display:grid;place-items:center;background:var(--disp);font:bold 56px var(--ui);color:var(--wave)}

/* ---------- visualizer ---------- */
#w-vis .screen{flex:1;min-height:0;background:#000;padding:2px}
#w-vis canvas{width:100%;height:100%;display:block}
#w-vis .vtool{display:flex;gap:3px;align-items:center}
#w-vis.full{position:fixed;inset:0;z-index:60}

/* ---------- dialogs ---------- */
.float>.tbar{cursor:default}
.float{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--hi),4px 4px 0 rgba(0,0,0,.35)}
.backdrop{position:fixed;inset:0;z-index:45;background:transparent}
#w-edit{width:min(960px,94vw);max-height:92vh}
#w-edit .body{overflow:auto;gap:10px;padding:8px}
#w-mash{width:min(640px,94vw);max-height:92vh}
#w-mash .body{overflow:auto;gap:8px;padding:8px}
#w-mash select{height:23px;font:12px var(--ui);background:#fff;color:#000;border:0;padding:0 4px;max-width:360px}
.group{border:0;padding:14px 10px 10px;position:relative;margin-top:4px;box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow)}
.group>.lg{position:absolute;top:-7px;left:8px;padding:0 3px;font:12px var(--ui);background:var(--face)}
.group .note{font-size:11.5px;color:var(--muted);margin-top:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srow{display:flex;align-items:center;gap:8px;margin:2px 0}
.srow .lab{width:50px}
.srow output{width:60px;text-align:right}
.btnrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.edwave{height:70px;width:100%;display:block;cursor:pointer}
.stems{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stem{padding:8px;box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--shadow)}
.stem .n{display:flex;justify-content:space-between;font:bold 11px var(--ui);margin-bottom:2px}
.stem .ms{display:flex;gap:3px;margin-top:2px}
.stem .ms .pill{flex:1;height:21px}
.tray{position:absolute;z-index:30;right:6px;bottom:52px;width:300px;box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shadow),inset 2px 2px 0 var(--hi),3px 3px 0 rgba(0,0,0,.35)}
.tray .body{gap:6px;padding:8px}
#pick{width:min(600px,92vw);height:min(520px,80vh)}
.eqgrid{display:grid;grid-template-columns:44px 28px 110px 1fr 1fr 1fr;gap:5px 10px;align-items:center}
.eqgrid .h{font-size:11.5px;color:#404040}
.eqgrid select{height:22px;border:0;background:#fff;padding:0 4px;font:12px var(--ui)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin:0;background:#fff;cursor:pointer;
  box-shadow:inset 1px 1px 0 var(--shadow),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite);display:grid;place-items:center}
input[type=checkbox]:checked::after{content:"✓";font:bold 11px/1 var(--ui);color:#000}
input[type=range]:disabled{opacity:.4}

.toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:80;padding:3px 8px;background:#ffffe1;color:#000;border:1px solid #000;font:12px var(--ui);white-space:nowrap;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.dropall{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:rgba(0,0,128,.25);font:bold 14px var(--ui);color:#fff;text-shadow:1px 1px 0 #000}
</style>
</head>
<body>
<div class="app">
  <nav class="menubar" id="menubar">
    <div class="m"><button><u>F</u>ile</button><div class="dd">
      <button data-menu="import">Import Songs… <kbd>⌘O</kbd></button><button data-menu="queueall">Queue All Analysed Songs</button><button data-menu="record">Record Mix</button></div></div>
    <div class="m"><button><u>M</u>ix</button><div class="dd">
      <button data-menu="sync">Auto Sync <kbd>S</kbd></button><button data-menu="blend">Auto Blend</button><button data-menu="automix">Automix</button>
      <button data-menu="center">Centre the Blend Fader</button>
      <button data-menu="mashup">Mashup: Vocal over Beat… <kbd>M</kbd></button>
      <button data-menu="autosplit" id="mAutoSplit">Split Stems Automatically</button><button data-menu="hqsplit" id="mHqSplit">High-Quality Splits (slower)</button></div></div>
    <div class="m"><button><u>V</u>iew</button><div class="dd">
      <button data-menu="editA">Edit Deck A <kbd>⌘2</kbd></button><button data-menu="editB">Edit Deck B</button><button data-menu="eqA">Equalizer Deck A</button><button data-menu="eqB">Equalizer Deck B</button><button data-menu="vis">Visualizer Full Screen</button></div></div>
    <div class="m"><button><u>H</u>elp</button><div class="dd">
      <button data-menu="keys">Keyboard Shortcuts</button></div></div>
    <span class="wm"><i></i>Blend</span>
  </nav>
  <div class="layout">
    <section class="win" id="w-vis"><div class="tbar"><span class="ico"></span><b>Visualizer</b><span class="cap"><button class="x" id="visfull2" title="Full screen">□</button></span></div>
      <div class="body"><div class="screen"><canvas id="vis"></canvas></div>
        <div class="vtool"><div class="seg" id="vismode"><button data-vm="bsod" class="on">Blue Screen</button><button data-vm="bars">Bars</button><button data-vm="tunnel">Tunnel</button></div>
          <span style="flex:1"></span><button class="pill" id="visfull">Full Screen</button></div></div></section>
    <section class="win deck" data-d="0"></section>
    <section class="win deck" data-d="1"></section>
    <section class="win" id="w-mix"><div class="tbar"><span class="ico"></span><b>Blend</b></div><div class="body" id="mixbody"></div></section>
    <section class="win" id="w-pl"><div class="tbar"><span class="ico"></span><b>Playlist</b></div><div class="body" id="plbody"></div></section>
    <section class="win" id="w-art"><div class="tbar"><span class="ico"></span><b id="arttitle">Handycam</b></div><div class="body">
      <div class="vjbox" id="vjbox"><div class="vjstack"><canvas class="vjbase" id="vj"></canvas><div class="vjred" id="vjred"></div><canvas class="vjtop" id="vjtop"></canvas></div><div class="vjnote" id="vjnote" hidden></div></div>

  const i = order.findIndex(s => s.key === d.key);
  for (let k = 1; k <= order.length; k++) { const s = order[(i + k + order.length) % order.length]; if (s && s.key !== other(d).key) return s.key; }
  return null;
}
function wireDeck(el, d) {
  if (el._wired) return; el._wired = true;
  el.addEventListener('pointerdown', () => { if (focus !== d) { focus = d; D.forEach(renderDeckBits); renderArt(); } }, true);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'play') toggle(d);
    else if (a === 'stop') { if (d.playing) { eng(d, 'pause'); d.playing = false; } seek(d, toDeck(d, d.song?.trimIn) ?? 0); renderDeckBits(d); }
    else if (a === 'prev') { seek(d, livePos(d) - cueOf(d) > 1 ? cueOf(d) : (toDeck(d, d.song?.trimIn) ?? 0)); }
    else if (a === 'next') { const k = nextSongKey(d); if (k) loadSong(d, k, false); }
    else if (a === 'back') jump(d, -1);
    else if (a === 'fwd') jump(d, 1);
    else if (a === 'load') openPicker(d);
    else if (a === 'edit') openEdit(d.i);
    else if (a === 'peq') openEqWin(d.i);
    else if (a === 'sync') setSync(!M.syncOn);
    else if (a === 'fx') { const open = !d.fxOpen; closeTrays(); d.fxOpen = open; renderDeck(d); }
    else if (a === 'fxclose') closeTrays();
    else if (a === 'split') { startSplit(d); }
    else if (a === 'stem') { const st = d.stems.find(x => x.name === b.dataset.stem); eng(d, 'mute', { stem: b.dataset.stem, on: !st.mute }); }
    else if (a === 'echo') { d.echo.on = !d.echo.on; applyFx(d); b.classList.toggle('on', d.echo.on); }
    else if (a === 'echobeat') { d.echo.beats = +b.dataset.b; applyFx(d); b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }
    else if (a === 'fxreset') { d.filter = 0; d.echo = { on: false, beats: 0.5, amt: 35 }; d.reverb = 0; applyFx(d); renderDeck(d); }
  });
  el.addEventListener('input', e => {
    const a = e.target.dataset.act, v = +e.target.value;
    if (a === 'vol') { d.vol = v; applyVol(d); }
    else if (a === 'filter') { d.filter = Math.abs(v) < 0.04 ? 0 : v; applyFx(d); }
    else if (a === 'echoamt') { d.echo.amt = v; if (d.echo.on) applyFx(d); }
    else if (a === 'reverb') { d.reverb = v; applyFx(d); }
  });
  el.addEventListener('dblclick', e => { if (e.target.dataset.act === 'filter') { d.filter = 0; e.target.value = 0; applyFx(d); } });
  // the audio follows while you scrub: seeks are sent at most ~12 times a second, and the last one always lands
  let drag = null, lastSeek = 0, pendingT = null;
  const scrubTo = (t, final = false) => {
    if (!d.dur) return;
    t = clamp(t, 0, d.dur - 0.05); d.pos = t; d.at = performance.now(); d._hold = true;
    const now = performance.now();
    if (final || now - lastSeek > 80) { lastSeek = now; seek(d, t); pendingT = null; } else pendingT = t;
    if (final) { d._hold = false; renderDeckBits(d); }
  };
  setInterval(() => { if (pendingT != null && performance.now() - lastSeek > 80) { const t = pendingT; pendingT = null; lastSeek = performance.now(); seek(d, t); } }, 40);
  el.addEventListener('pointerdown', e => {
    const z = e.target.closest('[data-zoom]'), sk = e.target.closest('[data-seek]');
    if (sk && d.dur) {   // the position bar: click or drag anywhere along it
      const r = sk.getBoundingClientRect(), at = ev => clamp((ev.clientX - r.left - 8) / (r.width - 16), 0, 1) * d.dur;
      scrubTo(at(e));
      const mv = ev => scrubTo(at(ev)), up = ev => { scrubTo(at(ev), true); removeEventListener('pointermove', mv); removeEventListener('pointerup', up); };

  el.addEventListener('pointermove', e => {

    if (drag.moved) scrubTo(drag.pos - (e.clientX - drag.x) / drag.w * span);

  }, { passive: false });

  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); el.classList.remove('drop'); $('#dropall').hidden = true; importFiles(e.dataTransfer.files, d.i); });
}

const WAVE = '#e6e6e6';
function drawZoom(d, c) {

    for (const [t, lab] of [[toDeck(d, s?.trimIn), 'Start'], [toDeck(d, s?.trimOut), 'End']]) if (t != null) { const x = (t - t0) * pxs; if (x >= 0 && x <= W) { g.fillStyle = '#ffff00'; g.fillRect(x - 1, 0, 2, H); g.fillStyle = '#000'; g.fillText(lab, x + 5, 44); } }

// the seek trackbar: sunken groove, section ticks, cue marks, a raised thumb (in the edit dialog: the whole song as a grey display)

    for (let x = 0; x < W; x += 2) { let m = 0; for (let k = Math.floor(x * step); k < Math.floor((x + 2) * step); k++) m = Math.max(m, wf[k] || 0); const h = m / 255 * H * 0.85; g.fillRect(x, H / 2 - h / 2, 2, h); }
    if (s?.trimIn != null) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(0, 0, toDeck(d, s.trimIn) / dur * W, H); }
    if (s?.trimOut != null) { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(toDeck(d, s.trimOut) / dur * W, 0, W, H); }
    (s?.cues || []).forEach(cq => { g.fillStyle = '#00ff00'; g.fillRect(toDeck(d, cq) / dur * W - 1, 0, 2, H); });
    g.fillStyle = '#fff'; g.fillRect(livePos(d) / dur * W - 1, 0, 3, H); return;
  }
  g.clearRect(0, 0, W, H);
  const L = 16, R = W - 16, y = H / 2;
  g.fillStyle = '#808080'; g.fillRect(L, y - 4, R - L, 2); g.fillStyle = '#000'; g.fillRect(L + 2, y - 2, R - L - 4, 2); g.fillStyle = '#fff'; g.fillRect(L, y + 2, R - L, 2); g.fillStyle = '#dfdfdf'; g.fillRect(L + 2, y, R - L - 4, 2);
